syntax = "proto3";

package order;

service OrderService {
    rpc CreateOrder(OrderRequest) returns (OrderResponse);
}

message OrderRequest {
    int32 product_id = 1;
    int32 quantity = 2;
    string email = 3;
}

message OrderResponse {
    bool success = 1;
    int32 order_id = 2;
    string message = 3;
}